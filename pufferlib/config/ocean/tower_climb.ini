[base]
package = ocean
env_name = puffer_tower_climb
policy_name = TowerClimb
rnn_name = TowerClimbLSTM

[vec]
num_envs = 4

[env]
num_envs = 1024
reward_climb_row = 0.36
reward_fall_row = 0
reward_illegal_move = -0.006
reward_move_block = 0.05

[train]
# https://wandb.ai/kywch/pufferlib/runs/8r3l9l1h?nw=nwuserkywch
total_timesteps = 300_000_000
anneal_lr = True
batch_size = auto
bptt_horizon = 64
minibatch_size = 65536

clip_coef = 0.33
ent_coef = 0.001
gae_lambda = 0.96
gamma = 0.91
vf_clip_coef = 4.6
vf_coef = 2.0

learning_rate = 0.05
max_grad_norm = 5.0

adam_beta1 = 0.56
adam_beta2 = 0.998
adam_eps = 3e-13
prio_alpha = 0.98
prio_beta0 = 0.98
vtrace_c_clip = 2.0
vtrace_rho_clip = 5.0

[sweep]
metric = perf
metric_distribution = percentile

[sweep.train.total_timesteps]
distribution = uniform
min = 10_000_000
max = 1_000_000_000
scale = 0.5

[sweep.env.reward_climb_row]
distribution = uniform
min = 0.0
max = 1.0
scale = auto

[sweep.env.reward_fall_row]
distribution = uniform
min = -1.0
max = 0.0
scale = auto

[sweep.env.reward_illegal_move]
distribution = uniform
min = -1e-2
max = -1e-4
scale = auto

[sweep.env.reward_move_block]
distribution = uniform
min = 0.0
max = 1.0
scale = auto
