[base]
package = ocean
env_name = puffer_g2048
policy_name = G2048
rnn_name = Recurrent

[policy]
hidden_size = 256
; hidden_size = 512

[rnn]
input_size = 256
hidden_size = 256
; input_size = 512
; hidden_size = 512

[vec]
num_envs = 4

[env]
num_envs = 4096
reward_scaler = 0.67
scaffolding_ratio = 0.6
use_heuristic_rewards = True
snake_reward_weight = 0.00067

[train]
# 256 hidden: https://wandb.ai/kywch/pufferlib/runs/zntn6zn2/overview?nw=nwuserkywch
# 512 hidden: https://wandb.ai/kywch/pufferlib/runs/pjnhojyj?nw=nwuserkywch
total_timesteps = 6_767_676_767
; total_timesteps = 1_000_000_000
anneal_lr = True
batch_size = auto
bptt_horizon = 64
minibatch_size = 32768

clip_coef = 0.067
ent_coef = 0.0267
gae_lambda = 0.67
gamma = 0.99567
vf_clip_coef = 0.167
vf_coef = 2.0

# for 256 hidden
learning_rate = 0.0006
max_grad_norm = 0.67

# for 512 hidden
; learning_rate = 0.0005
; max_grad_norm = 0.6


# These are newer puffer PPO params. Need more sweeping.
adam_beta1 = 0.99
adam_beta2 = 0.9999
adam_eps = 0.0001
prio_alpha = 0.8
prio_beta0 = 0.1
vtrace_c_clip = 2.0
vtrace_rho_clip = 1.1


### Targeted sweep

[sweep]
metric = score
goal = maximize
sweep_only = scaffolding_ratio, learning_rate, max_grad_norm, vf_clip_coef
downsample = 1

[sweep.env.scaffolding_ratio]
distribution = uniform
min = 0.1
mean = 0.5
max = 0.8
scale = auto

[sweep.train.learning_rate]
distribution = uniform
min = 0.0001
mean = 0.0005
max = 0.0030
scale = 0.5

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.1
mean = 0.5
max = 2.0
scale = 0.5

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.05
max = 0.5
mean = 0.2
scale = auto


