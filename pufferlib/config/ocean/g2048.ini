[base]
package = ocean
env_name = puffer_g2048
policy_name = G2048
rnn_name = Recurrent

[policy]
hidden_size = 128

[rnn]
input_size = 128
hidden_size = 128

[vec]
num_envs = 4

[env]
num_envs = 4096
scaffolding_ratio = 0.6

[train]
# base: https://wandb.ai/kywch/pufferlib/runs/aoga4hc9?nw=nwuserkywch
total_timesteps = 3_000_000_000
anneal_lr = True
batch_size = auto
bptt_horizon = 64
minibatch_size = 32768

adam_beta1 = 0.99
adam_beta2 = 0.9999
adam_eps = 0.0001
clip_coef = 0.1
ent_coef = 0.03
gae_lambda = 0.7
gamma = 0.995
learning_rate = 0.001
max_grad_norm = 0.8
prio_alpha = 0.8
prio_beta0 = 0.1
vf_clip_coef = 1.0
vf_coef = 2.0
vtrace_c_clip = 2.0
vtrace_rho_clip = 1.1


[sweep]
metric = score
goal = maximize

[sweep.env.scaffolding_ratio]
distribution = uniform
min = 0.0
mean = 0.5
max = 0.8
scale = auto


[sweep.train.total_timesteps]
distribution = log_normal
min = 3e8
max = 1e10
mean = 1e9
scale = time

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00001
mean = 0.001
max = 0.1
scale = 0.5

[sweep.train.gamma]
distribution = logit_normal
min = 0.8
mean = 0.995
max = 0.9999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.01
mean = 0.7
max = 0.995
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.01
max = 1.0
mean = 0.1
scale = auto
