[base]
package = ocean
env_name = puffer_g2048
policy_name = G2048
rnn_name = Recurrent

[policy]
hidden_size = 128

[rnn]
input_size = 128
hidden_size = 128

[vec]
num_envs = 4

[env]
num_envs = 4096
reward_scaler = 0.5
scaffolding_ratio = 0.6
snake_reward_weight = 0.00005

[train]
# https://wandb.ai/kywch/pufferlib/runs/uuoqwi1t/overview?nw=nwuserkywch
total_timesteps = 6_500_000_000
anneal_lr = True
batch_size = auto
bptt_horizon = 64
minibatch_size = 32768

adam_beta1 = 0.99
adam_beta2 = 0.9999
adam_eps = 0.0001
clip_coef = 0.1
ent_coef = 0.03
gae_lambda = 0.7
gamma = 0.995
learning_rate = 0.001
max_grad_norm = 0.8
prio_alpha = 0.8
prio_beta0 = 0.1
vf_clip_coef = 0.5
vf_coef = 2.0
vtrace_c_clip = 2.0
vtrace_rho_clip = 1.1


### Targeted sweep

[sweep]
metric = score
goal = maximize
sweep_only = reward_scaler, snake_reward_weight, learning_rate, vf_clip_coef
downsample = 1
num_random_samples = 10

[sweep.train.learning_rate]
distribution = uniform
min = 0.0003
mean = 0.001
max = 0.002
scale = 0.5

[sweep.env.reward_scaler]
distribution = uniform
min = 0.1
mean = 0.5
max = 1.0
scale = auto

[sweep.env.snake_reward_weight]
distribution = uniform
min = 0.00001
mean = 0.00005
max = 0.0002
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.2
max = 1.0
mean = 0.5
scale = auto


